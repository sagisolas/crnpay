<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Алерты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@600&family=Unbounded:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --display: "Unbounded", system-ui, sans-serif;
        --text: "Golos Text", system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: transparent;
      }
      body.framed {
        background:
          radial-gradient(120% 90% at 80% 20%, #3b4a7a 0%, transparent 60%),
          radial-gradient(90% 80% at 10% 100%, #24345e 0%, transparent 70%), #1a2547;
      }

      .alert {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 10vw;
        text-align: center;
        color: #fff;
      }
      .alert[hidden] {
        display: none;
      }
      .alert-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        gap: 0 1.6vw;
        -webkit-text-stroke: 0.7vw rgba(10, 14, 30, 0.9);
        paint-order: stroke fill;
      }
      .alert-nick {
        color: #ffd23f;
        font: 800 4.2vw/1.15 var(--display);
        overflow-wrap: anywhere;
        min-width: 0;
      }
      .alert-dash {
        font: 800 4.2vw/1.15 var(--display);
      }
      .alert-amount {
        font: 800 4.2vw/1.15 var(--display);
        white-space: nowrap;
        letter-spacing: -0.01em;
      }
      .alert-amount small {
        font-size: 0.6em;
        margin-left: 0.3em;
      }
      .alert-msg {
        margin-top: 1.4vw;
        max-width: 72vw;
        font: 600 2.5vw/1.35 var(--text);
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        text-shadow:
          0 0.2vw 0 rgba(10, 14, 30, 0.9),
          0 0 1.2vw rgba(10, 14, 30, 0.8);
      }

      .alert.is-in .alert-head {
        animation: pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      .alert.is-in .alert-msg {
        animation: rise 0.45s 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .alert.is-out {
        animation: leave 0.4s ease-in both;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(1vw);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes leave {
        to {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .alert.is-in *,
        .alert.is-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="alert" id="alert" hidden>
      <div class="alert-head">
        <span class="alert-nick" id="nick"></span>
        <span class="alert-dash">—</span>
        <span class="alert-amount" id="amount"></span>
      </div>
      <div class="alert-msg" id="msg"></div>
    </div>
    <script>
      const SAMPLES = [
        {
          nick: "kazan_fox",
          amount: "10.0709",
          token: "USDT",
          message:
            "Привет из Казани! Спасибо за вчерашний стрим, третий час подряд смотрю как ты проходишь этот уровень",
        },
        { nick: "", amount: "0.05", token: "XMR", message: "На новый микрофон 🎙" },
        {
          nick: "Сергей_из_Твери_который_очень",
          amount: "0.00042",
          token: "BTC",
          message:
            "Длинный ник тоже должен поместиться. А это сообщение почти на триста символов, чтобы проверить, как алерт ведёт себя с большим текстом: переносы строк, длинные слова вроде антиконституционность, и всё такое. Стример читает вслух, зрители читают глазами, поэтому текст должен оставаться разборчивым даже в маленьком окне OBS.",
        },
      ];
      const SHOW_MS = 8000;
      const params = new URLSearchParams(location.search);
      if (!params.has("obs")) document.body.classList.add("framed");

      const el = document.getElementById("alert");
      let i = 0;

      function show(a) {
        document.getElementById("nick").textContent = a.nick || "Аноним";
        const amount = document.getElementById("amount");
        amount.textContent = a.amount;
        amount.append(Object.assign(document.createElement("small"), { textContent: a.token }));
        document.getElementById("msg").textContent = a.message;
        el.hidden = false;
        el.className = "alert";
        void el.offsetWidth;
        el.classList.add("is-in");
        setTimeout(() => {
          el.className = "alert is-out";
        }, SHOW_MS - 400);
        setTimeout(next, SHOW_MS + 600);
      }
      function next() {
        el.hidden = true;
        show(SAMPLES[i++ % SAMPLES.length]);
      }
      next();
    </script>
  </body>
</html>
