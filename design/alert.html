<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Алерты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@600&family=Unbounded:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --display: "Unbounded", system-ui, sans-serif;
        --text: "Golos Text", system-ui, sans-serif;
        --accent: #5cb8ff;
        --outline: rgba(10, 14, 30, 0.9);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: transparent;
      }
      body.framed {
        background:
          radial-gradient(120% 90% at 80% 20%, #3b4a7a 0%, transparent 60%),
          radial-gradient(90% 80% at 10% 100%, #24345e 0%, transparent 70%), #1a2547;
      }

      .alert {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 10vw;
        text-align: center;
        color: #fff;
      }
      .alert[hidden] {
        display: none;
      }
      .alert-icon {
        width: 7.7vw;
        height: 7.7vw;
        margin-bottom: 1.4vw;
        filter: drop-shadow(0 0.4vw 1vw rgba(10, 14, 30, 0.6));
      }
      .alert-icon[hidden] {
        display: none;
      }
      .alert-title {
        margin: 0;
        font: 800 3.4vw/1.2 var(--display);
        overflow-wrap: anywhere;
        -webkit-text-stroke: 0.6vw var(--outline);
        paint-order: stroke fill;
      }
      .alert-nick,
      .alert-amount {
        color: var(--accent);
      }
      .alert-amount {
        white-space: nowrap;
      }
      .alert-msg {
        margin-top: 1.4vw;
        max-width: 72vw;
        font: 600 2.5vw/1.35 var(--text);
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        text-shadow:
          0 0.2vw 0 var(--outline),
          0 0 1.2vw rgba(10, 14, 30, 0.8);
      }

      .alert.is-in {
        animation: fade 0.4s ease-out both;
      }
      .alert.is-out {
        animation: fade 0.4s ease-in reverse both;
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .alert.is-in,
        .alert.is-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="alert" id="alert" hidden>
      <img class="alert-icon" id="icon" alt="" />
      <p class="alert-title">
        <span class="alert-nick" id="nick"></span> отправил
        <span class="alert-amount" id="amount"></span>
      </p>
      <div class="alert-msg" id="msg"></div>
    </div>
    <script>
      const SAMPLES = [
        {
          nick: "kazan_fox",
          amount: "10.0709",
          token: "USDT",
          message:
            "Привет из Казани! Спасибо за вчерашний стрим, третий час подряд смотрю как ты проходишь этот уровень",
        },
        { nick: "", amount: "0.05", token: "XMR", message: "На новый микрофон 🎙" },
        {
          nick: "Сергей_из_Твери_который_очень",
          amount: "0.00042",
          token: "BTC",
          message:
            "Длинный ник тоже должен поместиться. А это сообщение почти на триста символов, чтобы проверить, как алерт ведёт себя с большим текстом: переносы строк, длинные слова вроде антиконституционность, и всё такое. Стример читает вслух, зрители читают глазами, поэтому текст должен оставаться разборчивым даже в маленьком окне OBS.",
        },
      ];
      const ICONS = {
        usdt: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><g fill="none" fill-rule="evenodd"><circle cx="16" cy="16" r="16" fill="#26A17B"/><path fill="#FFF" d="M17.922 17.383v-.002c-.11.008-.677.042-1.942.042-1.01 0-1.721-.03-1.971-.042v.003c-3.888-.171-6.79-.848-6.79-1.658 0-.809 2.902-1.486 6.79-1.66v2.644c.254.018.982.061 1.988.061 1.207 0 1.812-.05 1.925-.06v-2.643c3.88.173 6.775.85 6.775 1.658 0 .81-2.895 1.485-6.775 1.657m0-3.59v-2.366h5.414V7.819H8.595v3.608h5.414v2.365c-4.4.202-7.709 1.074-7.709 2.118 0 1.044 3.309 1.915 7.709 2.118v7.582h3.913v-7.584c4.393-.202 7.694-1.073 7.694-2.116 0-1.043-3.301-1.914-7.694-2.117"/></g></svg>',
        xmr: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><g fill="none" fill-rule="evenodd"><circle cx="16" cy="16" r="16" fill="#F60"/><path fill="#FFF" fill-rule="nonzero" d="M15.97 5.235c5.985 0 10.825 4.84 10.825 10.824a11.07 11.07 0 01-.558 3.432h-3.226v-9.094l-7.04 7.04-7.04-7.04v9.094H5.704a11.07 11.07 0 01-.557-3.432c0-5.984 4.84-10.824 10.824-10.824zM14.358 19.02L16 20.635l1.613-1.614 3.051-3.08v5.72h4.547a10.806 10.806 0 01-9.24 5.192c-3.902 0-7.334-2.082-9.24-5.192h4.546v-5.72l3.08 3.08z"/></g></svg>',
        btc: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><g fill="none" fill-rule="evenodd"><circle cx="16" cy="16" r="16" fill="#F7931A"/><path fill="#FFF" fill-rule="nonzero" d="M23.189 14.02c.314-2.096-1.283-3.223-3.465-3.975l.708-2.84-1.728-.43-.69 2.765c-.454-.114-.92-.22-1.385-.326l.695-2.783L15.596 6l-.708 2.839c-.376-.086-.746-.17-1.104-.26l.002-.009-2.384-.595-.46 1.846s1.283.294 1.256.312c.7.175.826.638.805 1.006l-.806 3.235c.048.012.11.03.18.057l-.183-.045-1.13 4.532c-.086.212-.303.531-.793.41.018.025-1.256-.313-1.256-.313l-.858 1.978 2.25.561c.418.105.828.215 1.231.318l-.715 2.872 1.727.43.708-2.84c.472.127.93.245 1.378.357l-.706 2.828 1.728.43.715-2.866c2.948.558 5.164.333 6.097-2.333.752-2.146-.037-3.385-1.588-4.192 1.13-.26 1.98-1.003 2.207-2.538zm-3.95 5.538c-.533 2.147-4.148.986-5.32.695l.95-3.805c1.172.293 4.929.872 4.37 3.11zm.535-5.569c-.487 1.953-3.495.96-4.47.717l.86-3.45c.975.243 4.118.696 3.61 2.733z"/></g></svg>',
      };
      const ICON_BASE = "https://cdn.jsdelivr.net/npm/cryptocurrency-icons@0.18.1/svg/color/";
      const SHOW_MS = 8000;
      const params = new URLSearchParams(location.search);
      if (!params.has("obs")) document.body.classList.add("framed");

      const el = document.getElementById("alert");
      const icon = document.getElementById("icon");
      icon.onerror = () => (icon.hidden = true);
      let i = 0;

      function show(a) {
        icon.hidden = false;
        const id = a.token.toLowerCase();
        icon.src = ICONS[id]
          ? `data:image/svg+xml,${encodeURIComponent(ICONS[id])}`
          : `${ICON_BASE}${id}.svg`;
        document.getElementById("nick").textContent = a.nick || "Аноним";
        document.getElementById("amount").textContent = `${a.amount} ${a.token}`;
        document.getElementById("msg").textContent = a.message;
        el.hidden = false;
        el.className = "alert";
        void el.offsetWidth;
        el.classList.add("is-in");
        setTimeout(() => {
          el.className = "alert is-out";
        }, SHOW_MS - 400);
        setTimeout(next, SHOW_MS + 600);
      }
      function next() {
        el.hidden = true;
        show(SAMPLES[i++ % SAMPLES.length]);
      }
      next();
    </script>
  </body>
</html>
