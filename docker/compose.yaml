services:
  app:
    container_name: crnpay
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: host.docker.internal:5000/crnpay:latest
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-../.env}
    environment:
      CONFIG_PATH: /config/config.json
      DB_PATH: /data/crnpay.db
    volumes:
      - /crnpay/config.json:/config/config.json:ro
      - data:/data
    read_only: true
    tmpfs:
      - /tmp

  caddy:
    container_name: caddy_crnpay
    image: host.docker.internal:5000/caddy_crnpay:latest
    env_file: ${APP_ENV_FILE:-../.env}
    build:
      context: ..
      dockerfile: docker/Caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
    depends_on:
      - app

volumes:
  data:
  caddy_data:
