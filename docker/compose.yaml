services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      CONFIG_PATH: /config/config.json
      DB_PATH: /data/crnpay.db
    volumes:
      - ../config.json:/config/config.json:ro
      - data:/data
    read_only: true
    tmpfs:
      - /tmp

  caddy:
    build:
      context: ..
      dockerfile: docker/Caddy.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the environment}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  data:
  caddy_data:
