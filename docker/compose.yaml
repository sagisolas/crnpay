services:
  app:
    image: crnpay:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      CONFIG_PATH: /config/config.json
      DB_PATH: /data/crnpay.db
    volumes:
      - /crnpay/config.json:/config/config.json:ro
      - data:/data
    read_only: true
    tmpfs:
      - /tmp

  caddy:
    image: caddy_ratelimit:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
    depends_on:
      - app

volumes:
  data:
  caddy_data:
